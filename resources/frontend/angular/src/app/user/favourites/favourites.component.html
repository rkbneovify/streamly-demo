<div class="landing_carousel_section2 mt-5" *ngIf="favListData?.length">
  <div class="landing_carousel_section2_top">
    Favourite Channel
    <span class="pointer" *ngIf="favListData?.length > 6" 
      [routerLink]="'/user/channels/favourites'"> See More >></span>
  </div>
  <div class="landing_carousel_section2_bottom mt-3 d-flex">
    <div class="card_page" *ngFor="let item of favListData">
      <img
        loading="lazy"
        *ngIf="item.image"
        class="p-2"
        [src]="
          item.image ? item.image : '../../../assets/dummy-img/play_icon.svg'
        "
        alt=""
      />
      <p class="no-img" *ngIf="!item.image">No Image</p>
      <div class="card_content">
        <div class="card_content_text1 d-flex justify-content-between">
          <div
            class="play_img d-flex align-items-center gap-2"
            (click)="setplayerData(item?.url,item?.id)"
          >
            <img
              loading="lazy"
              src="../../../assets/dummy-img/play_icon.svg"
              alt=""
            />
            <p class="d-flex flex-column">
              Play
            </p>
          </div>
          <div class="d-flex gap-2">
            <div
              class="rounded-circle"
              (click)="toggleFavorite(item.id)"
            >
              <img
                loading="lazy"
                class="rounded-circle"
                src="../../../assets/dummy-img/heart-circle.svg"
                alt=""
                [class.favorite]="isFavorite(item.id)"
              />
            </div>
            <div>
              <img
                loading="lazy"
                src="../../../assets/dummy-img/more-circle.svg"
                alt=""
              />
            </div>
          </div>
        </div>
        <div class="card_content_text2 my-5">
          <p class="mb-2" *ngIf="item.stationName">{{ item.stationName }}</p>
          <p class="card_content_text3 mb-2" *ngIf="item.callSign">{{ item?.callSign }}</p>
          <p class="card_content_text3" *ngIf="item.timeZone">{{ item.timeZone }}</p>
          <p *ngIf="!item.stationName && !item.callSign && !item.timeZone" class="ms-4 card_content_text3">
            Details not found 
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="landing_carousel_section2 mt-5" *ngIf="recentsPlayData?.length">
  <div class="landing_carousel_section2_top">
    Recently Played
    <span class="pointer" *ngIf="recentsPlayData?.length > 6"
      [routerLink]="'/user/channels/recents-channels'"> See More >></span>
  </div>

  <div class="landing_carousel_section2_bottom mt-3 d-flex">
    <div class="card_page" *ngFor="let item of recentsPlayData">
      <img
        *ngIf="item.image"
        loading="lazy"
        [src]="
          item.image ? item.image : '../../../assets/dummy-img/play_icon.svg'
        "
        alt=""
      />
      <p class="no-img" *ngIf="!item.image">No Image</p>

      <div class="card_content">
        <div class="card_content_text1 d-flex justify-content-between">
          <div
            class="play_img d-flex align-items-center gap-2"
            (click)="setplayerData(item?.url,item?.id)"
          >
            <img
              loading="lazy"
              src="../../../assets/dummy-img/play_icon.svg"
              alt=""
            />
            <p class="d-flex flex-column">
              Play
            </p>
          </div>
          <div class="d-flex gap-2">
            <svg
              [title]="'favorite'"
              class="mt-2 me-2"
              (click)="toggleFavorite(item.id)"
              [class.favActive]="isFavorite(item.id)"
              id="heart-icon"
              width="30"
              height="30"
              viewBox="0 0 30 30"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              cursor="pointer"
            >
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                fill="#ccc"
              />
            </svg>
            <div>
              <img
                loading="lazy"
                src="../../../assets/dummy-img/more-circle.svg"
                alt=""
              />
            </div>
          </div>
        </div>
        <div class="card_content_text2 my-5" >
          <p *ngIf="item.stationName" class="mb-2">{{ item.stationName }}</p>
          <p *ngIf="item.callSign"class="mb-2 card_content_text3">
            {{ item?.callSign }}
          </p>
          <p class="card_content_text3" *ngIf="item.timeZone">{{ item.timeZone }}</p>
          <p *ngIf="!item.stationName && !item.callSign && !item.timeZone" class="ms-4 card_content_text3">
            Details not found 
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="noData" *ngIf="!recentsPlayData?.length && !favListData?.length">
  <p class="m-auto">
    No Data
  </p>
</div>


<div *ngIf="isLoading" class="loader-overlay">
  <div class="loader"></div>
</div>
