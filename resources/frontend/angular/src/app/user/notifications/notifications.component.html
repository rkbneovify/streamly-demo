<main>

    <div class="scroll-container" infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollThrottle]="500"
        (scrolled)="onScrollDown()">
        <ng-container>

            <div class="top-area">
                <h1>Notifications</h1>

                <div class="container" *ngFor="let item of data">
                    <div class="item">
                        <div class="bell">
                            <img src="../../../assets/dummy-img/notification2.svg" alt="">
                        </div>

                        <div class="content">
                            <div class="content-header">
                                <b>{{item.event_type | titlecase }}</b>
                                <span>{{ item.created_at | timeAgo | titlecase}}</span>
                            </div>

                            <p>{{item.description}}</p>


                        </div>

                    </div>
                </div>



            </div>

        </ng-container>
    </div>













</main>
