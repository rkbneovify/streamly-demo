<main>

    <div class="scroll-container" infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollThrottle]="500"
        (scrolled)="onScrollDown()">
        <ng-container>

            <div class="top-area">
                <h1>Notifications</h1>

                <div class="container" *ngFor="let item of data">
                    <div class="item">
                        <div class="bell">
                            <img src="../../../assets/dummy-img/notification.svg" alt="">
                        </div>

                        <div class="content">
                            <b>{{item.event_type}}</b>
                            <p>{{item.description}}</p>

                            <span>{{ item.created_at | date:'dd/MM/yyyy hh:mm:ss a' }}</span>
                        </div>

                    </div>
                </div>



            </div>

        </ng-container>
    </div>













</main>
