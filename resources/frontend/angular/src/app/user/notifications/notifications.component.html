<main>

    <div class="scroll-container" infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollThrottle]="500"
        (scrolled)="onScrollDown()">

        <div class="top-area">
            <h1>Notifications</h1>

            <div class="data-list" *ngIf="data.length > 0; else elseTemplate">
                <div class="data-list" *ngFor="let item of data">
                    <div class="item">
                        <div class="bell">
                            <img src="../../../assets/dummy-img/notification2.svg" alt="">
                        </div>

                        <div class="content">
                            <div class="content-header">
                                <b>{{item.event | titlecase }}</b>
                                <span>{{ item.created_at | timeAgo | titlecase}}</span>
                            </div>

                            <p>{{item.description}}</p>


                        </div>

                    </div>
                </div>

            </div>

            <ng-template #elseTemplate>
                <div *ngIf="!isLoading" class="data-not-found">
                    <b>Data not found !</b>
                </div>
            </ng-template>



        </div>

    </div>













</main>
