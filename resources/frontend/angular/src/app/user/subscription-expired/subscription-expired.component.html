<div class="pnf-background">
  <img loading="lazy" src="../../assets/dummy-img/404-bg.png" alt="" />
</div>

<div class="container">
  <div class="sub-container">
    <div class="main-container justify-content-center">
      <div class="pnf-heading">
        <div class="pnf-subExp-img">
          <img loading="lazy" src="../../../assets/dummy-img/subExp.svg" alt="" />
        </div>
        <div class="pnf-bottom-text">
          <h2>Your subscription has expired</h2>
          <p>
            To get a subscription please click on the upgrade plan button below or contact at streamlytvadmin.com
          </p>
        </div>
        <div class="flex">
          <div *ngIf="error.plan_count >1" class="pnf-button">
            <button [routerLink]="'/user/plan'">Subscribe Now</button>
          </div>
          <div *ngIf="error" class="pnf-button">
            <a [href]="error.url" target="_blank">
              <button>Pay Now</button>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
