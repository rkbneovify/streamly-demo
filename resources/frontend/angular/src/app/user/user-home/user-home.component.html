    <div class="landing_carousel_container">
      <div
        id="carouselExampleIndicators"
        class="carousel slide"
        data-bs-ride="carousel"
        >
          <div class="carousel-indicators">
            <button *ngFor="let index of sldierData; let i = index"
                    type="button"
                    [attr.data-bs-target]="'#carouselExampleIndicators'"
                    [attr.data-bs-slide-to]="i"
                    [class.active]="i === 0"
                    [attr.aria-label]="'Slide ' + (i + 1)">
            </button>
          </div>
          
          <div class="carousel-inner">
              <div *ngFor="let data of sldierData; let i = index;" [ngClass]="{'carousel-item':true, 'active':i==0}" data-bs-interval="2000">
                  <div class="landing_carousel_section1">
                      <div class="landing_carousel_section1_img">
                      <img src={{data.image}} alt="" loading="lazy" /> 
                      </div>
                      <div class="landing_carousel_section1_text_content">
                      <!-- <div class="landing_carousel_section1_img1">
                          <img src="../../assets/dummy-img/homeuniverse.png" alt="" />
                      </div> -->
  
                      <div class="landing_carousel_section1_img3 d-flex flex-column">
                          <!-- <div class="landing_carousel_section1_img2">
                          <img src="../../assets/dummy-img/sci.png" alt="" />
                          </div> -->
  
                          <div class="d-flex align-items-center justify-content-between">
                          <div (click)="setplayerData(data.dash_url,data?.channel_id)" class="play_img pointer d-flex align-items-center">
                              <img loading="lazy" src="../../assets/dummy-img/play_icon.svg" alt="" />
                              <p>Play</p>
                          </div>
                          <!-- <div class="heart_circle pointer ms-2" (click)="addFavouriteChannel(data.channel_id)">
                              <img src="../../assets/dummy-img/heart-circle.svg" alt="" />
                          </div> -->
                          <div class="heart_circle pointer ms-2" (click)="toggleFavorite(data.channel_id)">
                            <img loading="lazy" src="../../assets/dummy-img/heart-circle.svg" alt="" [class.favorite]="isFavorite(data.channel_id)">
                        </div>
                          <!-- <div class="info_circle pointer">
                              <img src="../../assets/dummy-img/info-circle.svg" alt="" />
                          </div> -->
                          </div>
                      </div>
                      </div>
                  </div>
              </div>
          </div>
  
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
  
      </div>
  
      <!-- <app-skeleton-loader *ngIf="isLoading" [count]="6" [height]="240" [width]="160">
      </app-skeleton-loader> -->
      
      <div class="landing_carousel_section2 mt-5" *ngIf="recentsPlayData?.length">
          <div  class="landing_carousel_section2_top">Recently Played</div>
          <div class="landing_carousel_section2_bottom mt-3 d-flex">
            <div class="card_page" *ngFor="let item of recentsPlayData">
              <img
              *ngIf="item.image"
              loading="lazy"
                [src]="
                  item.image ? item.image : '../../../assets/dummy-img/play_icon.svg'
                "
                alt=""
              />
              <p class="no-img" *ngIf="!item.image">No Image</p>
        
              <div class="card_content">
                <div class="card_content_text1 d-flex justify-content-between">
                  <div
                    class="play_img d-flex align-items-center gap-2"
                    (click)="setplayerData(item?.url,item?.id)"
                  >
                    <img loading="lazy" src="../../../assets/dummy-img/play_icon.svg" alt="" />
                    <p class="d-flex flex-column">
                      Play
                      <!-- <span>S1 E1</span> -->
                    </p>
                  </div>
                  <div class="d-flex gap-2">
                    <div
                      class="rounded-circle"
                      (click)="toggleFavorite(item.id)"
                    >
                      <img loading="lazy"
                        class="rounded-circle"
                        src="../../../assets/dummy-img/heart-circle.svg"
                        alt=""
                        [class.favorite]="isFavorite(item.id)"
                      />
                    </div>
                    <div>
                      <img loading="lazy" src="../../../assets/dummy-img/more-circle.svg" alt="" />
                    </div>
                  </div>
                </div>
                <div class="card_content_text2 mt-5">
                  <p class="mb-2">{{ item.stationName }}</p>
                  <p class="mb-2 card_content_text3">
                    {{ item?.callSign }}
                  </p>
                  <p class="card_content_text3">
                    {{item.timeZone}}
                  </p>
                  <p *ngIf="!item.stationName && !item.callSign && !item.timeZone" class="ms-4 card_content_text3">
                    Details not found 
                  </p>
                </div>
              </div>
            </div>
          </div>
      </div>
  
      <div class="landing_carousel_section2 mt-5" *ngFor="let list of genre_Data">
          <div class="landing_carousel_section2_top">{{list?.genre_name}} <span *ngIf="list?.channels?.length > 6" class="pointer" [routerLink]="'/user/channels/'+list.genre_name">See More >></span></div>
          <div class="landing_carousel_section2_bottom mt-3 d-flex" >
              <div class="card_page" *ngFor="let data of list?.channels" >
                  <!-- <img loading="lazy" *ngIf="!data?.image" src="../../../assets/dummy-img/inf.png" alt=""> -->
                  <img loading="lazy" *ngIf="data?.image" [src]="data?.image" alt="">
              <p class="no-img" *ngIf="!data.image">No Image</p>
                  <div class="card_content">
                      <div class="card_content_text1 d-flex justify-content-between">
                          <div class="play_img d-flex align-items-center gap-2" (click)="setplayerData(data?.url,data?.id)">
                              <img loading="lazy" src="../../assets/dummy-img/play_icon.svg" alt="" />
                              <p class="d-flex flex-column">Play 
                                <!-- <span>S1 E1</span> -->
                            </p>
                          </div>
                          <div class="d-flex gap-2">
                              <div  class="rounded-circle" (click)="toggleFavorite(data.id)"><img src="../../assets/dummy-img/heart-circle.svg" alt="" [class.favorite]="isFavorite(data.id)"
                                class="rounded-circle"></div>
                              <div><img loading="lazy" src="../../assets/dummy-img/more-circle.svg" alt=""></div>
                          </div>
                      </div>
                      
                      <div class="card_content_text2 mt-5 ">
                        <p *ngIf="data?.stationName" class="mt-3 mb-2">{{data?.stationName}}</p>
                        <p *ngIf="data?.callSign" class="card_content_text3 mb-2">{{data?.callSign}}</p>
                        <p *ngIf="data.timeZone" class="card_content_text3">{{data.timeZone}}</p>
                        <p *ngIf="!data.stationName && !data.callSign && !data.timeZone" class="ms-4 card_content_text3">
                          Details not found 
                        </p>
                      </div>
                  </div>
              </div>
          </div>
          
      </div>
