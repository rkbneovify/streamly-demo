
<div class="landing_carousel_section2 mt-5">
    <div class="landing_carousel_section2_top">{{keyword}} Channels</div>
    <div class="landing_carousel_section2_bottom my-4 d-flex flex-wrap" >
        <div class="card_page" *ngFor="let item of data">
            <!-- <img src="../../../../assets/dummy-img/mvf2.png" alt=""> -->
            <!-- <img [src]="item.logo" alt=""> -->
            <!-- <img [src]="item?.prgSvcId? item?.gracenote_data?.URL+'/'+item?.gracenote_data?.assets?.asset[0].URL :item.logo " alt=""> -->
            <img *ngIf="item?.gracenote_data?.assets?.asset?.length" [src]="item?.prgSvcId? 'https://demo.tmsimg.com/'+item?.gracenote_data?.assets?.asset[4].URI :item.logo " alt="">

            <img *ngIf="!item?.gracenote_data?.assets?.asset?.length || !item?.prgSvcId" [src]="item?.logo" alt="">
            <div class="card_content">
                <div class="card_content_text1 d-flex justify-content-between">
                    <div class="play_img d-flex align-items-center gap-2" (click)="setplayerData(item?.url)">
                        <img src="../../../assets/dummy-img/play_icon.svg" alt="" />
                        <p class="d-flex flex-column">Play <span>S1 E1</span></p>
                    </div>
                    <div class="d-flex gap-2">
                        <div class="rounded-circle overflow-hidden" (click)="toggleFavorite(item.id)"><img class="rounded-circle" src="../../../assets/dummy-img/heart-circle.svg" alt="" 
                            [class.favorite]="isFavorite(item.id)"></div>
                        <div><img src="../../../assets/dummy-img/more-circle.svg" alt=""></div>
                    </div>
                </div>
                <div class="card_content_text2 my-5">
                    <p class="mb-4">{{item.stationName}}</p>
                    <p *ngIf="item?.gracenote_data" class="fw-light"><span class="fw-bold">Video Type :- </span> {{item?.gracenote_data?.videoQuality?.videoType}}</p>

                </div>
                <!-- <div class="card_content_text3">
                    Season 1 : Yorem ipsum dolor sit amet, consectetur adipiscing elit. Nunc vulputate libero et velit interdum, ac aliquet odio mattis.
                </div> -->
            </div>

        </div>
    </div>
</div>
