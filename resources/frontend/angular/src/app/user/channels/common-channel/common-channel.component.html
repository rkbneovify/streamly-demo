<div class="landing_carousel_section2 mt-1">
    <div class="landing_carousel_section2_top">{{keyword}} Channels</div>
    <div class="landing_carousel_section2_bottom my-4 d-flex flex-nowrap" *ngFor="let row of data">
      <div class="card_page" *ngFor="let item of row">
        <img
          loading="lazy"
          *ngIf="item?.gracenote_data?.assets?.asset?.length"
          [src]="
            item?.prgSvcId
              ? 'https://demo.tmsimg.com/' +
                item?.gracenote_data?.assets?.asset[0].URI
              : item.logo
          "
          alt=""
        />
        <img
        *ngIf="item?.image"
        loading="lazy"
        [src]="
          item?.image ? item?.image : '../../../assets/dummy-img/inf.png'
        "
        [ngClass]="{ 'object-fill': item?.type == 'event' }"
      />
    <p class="no-img" *ngIf="!item.image">No Image</p>
      
        <div class="card_content">
          <div class="card_content_text1 d-flex justify-content-between">
            <div
              class="play_img d-flex align-items-center gap-2"
              (click)="setplayerData(item?.url)"
            >
              <img
                loading="lazy"
                src="../../../assets/dummy-img/play_icon.svg"
                alt=""
              />
              <p class="d-flex flex-column">Play</p>
            </div>
            <div class="d-flex gap-2">
              <div
                class="rounded-circle"
                (click)="toggleFavorite(item.id)"
              >
                <img
                loading="lazy"
                  class="rounded-circle"
                  src="../../../assets/dummy-img/heart-circle.svg"
                  alt=""
                  [class.favorite]="isFavorite(item.id)"
                />
              </div>
              <div>
                <img
                  loading="lazy"
                  src="../../../assets/dummy-img/more-circle.svg"
                  alt=""
                />
              </div>
            </div>
          </div>
          <div class="card_content_text2 mt-5">
            <p class="mb-2" *ngIf="item.stationName">{{ item.stationName}}</p>
            <p class="mb-2 card_content_text3" *ngIf="item.callSign">{{ item.callSign }}</p>  
            <p class="mb-2 card_content_text3" *ngIf="item.timeZone"> {{ item.timeZone }}</p>  
          </div>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="isLoading" class="loader-overlay">
    <div class="loader"></div>
  </div>
