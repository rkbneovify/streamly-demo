<div class="row gy-0 gx-0 flex-nowrap overflow-hidden">
  <div [ngClass]="{ 'expanded': isExpanded }" class="sidebar_container col-1 p-0 d-flex flex-column justify-content-between align-items-center py-3">
    <div class="sidebar_1 pointer"  (click)="toggleSidebar()">
      <img src="../../assets/dummy-img/sidebar_arrow.svg" alt="" />
    </div>
    <div class="sidebar_2 d-flex flex-column justify-content-between align-items-center">
      <div (click)="activeTab='home'" routerLink="/user/home" [ngClass]="{'submenu1 pointer':true,'activeTab':activeTab==='home'}" >
        <img src="../../assets/dummy-img/sidemenu1.svg" alt="" />
      </div>
      <div (click)="activeTab='fav'" routerLink="/user/favorite" [ngClass]="{'submenu2 pointer my-5':true, 'activeTab':activeTab==='fav'}">
        <img src="../../assets/dummy-img/sidemenu2.svg" alt="" />
      </div>
      <div (click)="activeTab='playsh'" routerLink="/user/playlistschedule" [ngClass]="{'submenu3 pointer':true,'activeTab':activeTab==='playsh'}">
        <img src="../../assets/dummy-img/side_menu3.svg" alt="" />
      </div>
    </div>
    <div class="sidebar_3 pointer">
      <img src="../../assets/dummy-img/side_setting.svg" alt="" />
    </div>
  </div>
  <div class="col-11 p-0 m-0 flex_1">
    <main class="schedule_Container">
      <div class="row">
        <div class="col-12">
          <nav
            class="navbar_Schedule d-flex align-item-center justify-content-between"
          >
            <div class="logo-navbarL">
              <img src="../../assets/dummy-img/nav-logo.svg" alt="" srcset="" />
            </div>
            <div class="searchbar_pro d-flex gap-2">
              <div class="search_Bar">
                <input type="text" placeholder="" />
                <img src="../../assets/dummy-img/search-md.svg" alt="" />
              </div>
              <div class="position-relative">
                <div (click)="submenu = !submenu" class="schedule_profile pointer">
                  <img class="userProfileImage" src="../../assets/dummy-img/user-circle.svg" alt="" />
                </div>

                <div  *ngIf="submenu" class="profileUserMenu position-absolute">
                  <div (click)="submenu = false" routerLink="user-settings">
                    <img src="../../assets/dummy-img/user.svg" alt="" />
                    <p>Account Settings</p>
                  </div>
                  <div (click)="submenu = false" routerLink="connected-device">
                    <img src="../../assets/dummy-img/devices.svg" alt="" />
                    <p>Connected Devices</p>
                  </div>
                  <div (click)="submenu = false" routerLink="downloadapp">
                    <img src="../../assets/dummy-img/download.svg" alt="" />
                    <p>Download App</p>
                  </div>
                  <div class="justify-content-center" (click)="logoutUser()">
                    <!-- <img src="../../assets/dummy-img/download.svg" alt="" /> -->
                    <p class="position-relative min-hwl" [class.spinner]="loading">
                      <span class="nologout" *ngIf="!loading">
                        Log out
                      </span>
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </nav>
        </div>
      </div>
      <div class="animantiontest row justify-sm-content-center">
        <div class="col-12">
          <router-outlet></router-outlet>
        </div>
      </div>
    </main>
  </div>
</div>
