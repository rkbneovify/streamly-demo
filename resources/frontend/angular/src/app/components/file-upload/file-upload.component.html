<div class="upload-box" [class.dragging]="isDragging" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)">

  <!-- <input #fileInput type="file" multiple hidden accept=".jpg,.jpeg,.png,.heic,.heif,.mp4,.mov,image/*,video/*"
    (change)="onFileSelected($event)" /> -->

  <input #fileInput type="file" multiple hidden accept=".jpg,.jpeg,.png,.heic,.heif,image/*"
    (change)="onFileSelected($event)" />

  <div class="upload-content" (click)="fileInput.click()">
    <svg width="50" height="50" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 12.5V62.5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke="black" />
      <path d="M70.8337 33.3333L50.0003 12.5L29.167 33.3333" stroke-width="7" stroke-linecap="round"
        stroke-linejoin="round" stroke="black" />
      <path
        d="M87.5 62.5V79.1667C87.5 81.3768 86.622 83.4964 85.0592 85.0592C83.4964 86.622 81.3768 87.5 79.1667 87.5H20.8333C18.6232 87.5 16.5036 86.622 14.9408 85.0592C13.378 83.4964 12.5 81.3768 12.5 79.1667V62.5"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke="black" />
    </svg>

    <h2>Click to upload or drag file here</h2>
    <!-- <p>Images & Videos Supported</p> -->
    <p>Images Supported</p>
  </div>

</div>

<div class="preview-grid" *ngIf="files.length">

  <div class="preview-card" *ngFor="let item of files; let i = index">

    <button type="button" class="remove-btn" (click)="removeFile(i)">
      ×
    </button>

    <img *ngIf="item.type === 'image'" [src]="item.preview" alt="preview" />

    <video *ngIf="item.type === 'video'" [src]="item.preview" muted controls>
    </video>

    <div class="file-info" [title]="item.file.name">
      {{ item.file.name }}
    </div>

  </div>

</div>

<div class="action-bar" *ngIf="files.length">

  <span>
    {{ files.length }} file(s) selected
  </span>

  <button type="button" class="clear-btn" (click)="clearAll()">
    Clear All
  </button>

</div>
