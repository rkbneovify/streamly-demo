<div class="container-faq">
  <div class="main-faq">
    <div class="main-term-text my-2">
      <h3>Frequently Asked Questions</h3>
    </div>
<ng-container *ngFor="let faqItem of faqItems; let i = index">

  <div class="container-quesAns mb-3" (click)="toggleAnswer(i)">
    <div class="container-question d-flex justify-content-between px-2 px-sm-4">
      <p>{{faqItem.question_key}}</p>
      <div>
        <img loading="lazy" [class.rotateDonw]="faqItem.expanded" src="../../assets/dummy-img/chevron-down.svg" alt="" />
      </div>
    </div>
    <div class="container-answer px-2 px-sm-4 mt-2" [class.expanded]="faqItem.expanded">
      <p>
        {{faqItem?.question_answer}}
      </p>
    </div>
  </div>
</ng-container>

  </div>
</div>
