
<div class="container-contactUs">
    <div class="main-contactUs">
      <div class="main-term-text mt-3 position-relative">
        <div class="position-absolute d-flex back-btn_go" (click)="goBack()">
            <div>
                <img loading="lazy" src="../../assets/dummy-img/chevron-left.svg" alt="">
            </div>
            Go Back
        </div>

      </div>
    </div>
    <div class="mainSub-contactUs">
        <div>
            <h2>Contact Form</h2>
        </div>
        <div class="contact-form">
            <form class="contactForm" [formGroup]="contactForm" (ngSubmit)="onSubmit()">
                <div class="input_group">
                    <label class="label" for="name">Full Name</label>   
                    <input class="input_standred input_contact " type="text" placeholder="Enter name"
                    id="name" formControlName="name">
                </div>
                <div class="input_group">
                    <label class="label" for="email">Email</label>
                    <input class="input_standred input_contact " type="text" placeholder="Enter Email"id="email" formControlName="email" 
                    >
                </div>
                <div class="input_group">
                    <label for="textarea" class="label" for="message">Message</label>
                    <textarea name="" id="textarea" cols="30" rows="8" class="input_standred input_contact " placeholder="Enter Message"
                    id="message" formControlName="message"></textarea>
                </div>

                <div class="contactBtn">
                    <button type="submit" class="btn_2 btn-bg-gold" [disabled]="contactForm.invalid">
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
  </div>
