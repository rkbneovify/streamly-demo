
<div (click)="isChatbotShow = !isChatbotShow" class="chatbot-avatar">
    <img src="../../../../assets/dummy-img/chatbot4.gif" alt="">
    <div *ngIf="showTextBubble" class="text-bubble" [class.showTextBubble]="showTextBubble">Ask me any question!</div>
    </div> 
    
    <div class="chat-container" [class.open]="isChatbotShow"  *ngIf="isChatbotShow">
      <div class="chat-header">
        <h3>Chatbot</h3>
        <button (click)="closeChat()">×</button>
      </div>
    
      <div #chatMessages class="chat-messages">
        <div
          *ngFor="let message of messages"
          class="message"
          [class.user]="message.isUser"
          [class.bot]="!message.isUser"
          [class.error]="message.type === 'error'"
        >
          <!-- Display Text Messages with innerHTML if it contains HTML -->
          <p
            *ngIf="message.type === 'text' && message.isHtml"
            [innerHTML]="message.text"
          ></p>
          <p *ngIf="message.type === 'text' && !message.isHtml">
            {{ message.text }}
          </p>
    
          <!-- Display Loader for Loading Messages -->
          <p *ngIf="message.type === 'loading'" class="loading">...</p>
    
          <!-- Display Actions with Buttons -->
          <div *ngIf="message.type === 'actions'">
            <p>{{ message.text }}</p>
            <div class="actions" *ngIf="message.type === 'actions'">
              <button
                *ngFor="let action of message.actions"
                (click)="handleAction(action)"
              >
                {{ action.text }}
              </button>
            </div>
          </div>
        </div>
      </div>
    
      <div class="chat-input-container">
        <input
          class="chat-input"
          [(ngModel)]="newMessage"
          (keyup.enter)="sendMessage()"
          placeholder="Type a message..."
        />
        <button class="chat-send-button" (click)="sendMessage()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="16"
            fill="currentColor"
            class="bi bi-send"
            viewBox="0 0 16 16"
          >
            <path
              d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z"
            />
          </svg>
        </button>
      </div>
    </div>
