
<div class="container-contactUs">
    <div class="main-contactUs">
      <div class="main-term-text mt-3 position-relative">
        <div class="position-absolute d-flex back-btn_go" (click)="goBack()">
            <div>
                <img src="../../assets/dummy-img/chevron-left.svg" alt="">
            </div>
            Go Back
        </div>

      </div>
    </div>
    <div class="mainSub-contactUs">
        <div>
            <h2>Contact Form</h2>
        </div>
        <div class="contact-form">
            <form class="contactForm" >
                <div class="input_group">
                    <label class="label" for="">Full Name</label>   
                    <input class="input_standred input_contact " type="text" placeholder="Enter name">
                </div>
                <div class="input_group">
                    <label class="label" for="">Email</label>
                    <input class="input_standred input_contact " type="text" placeholder="Enter Email">
                </div>
                <div class="input_group">
                    <label for="textarea" class="label" for="">Message</label>
                    <textarea name="" id="textarea" cols="30" rows="8" class="input_standred input_contact " placeholder="Enter Message"></textarea>
                </div>

                <div class="contactBtn">
                    <button type="submit" class="btn_2 btn-bg-gold">
                        Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
  </div>
